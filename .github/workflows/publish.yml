# Trusted publishing (OIDC): no tokens, no 2FA. Publishes on version tags.
# One-time binding required on npmjs.com after the package exists:
#   package settings -> Publishing access -> Trusted Publisher ->
#   repository: cookiesheep/whale-on-desk, workflow: publish.yml, environment: (blank)
name: publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Skip gracefully when this version was already published from a laptop.
      - id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "whale-on-desk@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public
